name: התראות שעתיות

on:
  schedule:
    - cron: '0 6-18 * * *'  # כל שעה בין 08:00-20:00 שעון ישראל
  workflow_dispatch:

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: npm install
      - run: pip install anthropic python-dotenv requests
      - run: npx playwright install chromium --with-deps

      - name: שלוף נתונים
        env:
          LEUMI_USERNAME: ${{ secrets.LEUMI_USERNAME }}
          LEUMI_PASSWORD: ${{ secrets.LEUMI_PASSWORD }}
        run: node scrape.mjs

      - name: בדוק התראות
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 run_alerts.py --check large_transactions budget anomaly
